# Places in Tuzla where hosts could run an event, shown on the Make it yours page
# (site/extend.html, built by tools/extensions.py). Researched 2026-10-23; the
# research and every source is wiki/org/tuzla/venues-for-hosts.md (ADR
# wiki/org/adrs/make-it-yours-hub.md). GoatConf has arranged nothing with any of
# them: each is a place a host could ask.
#
# Only places with approved: true appear on the site; the organiser approves
# each one. Distances are computed from lat/lon to IPI Academy (places.yml);
# where only a street was found, the point is the street's (point: street).
# people is the largest group a source says the place holds (seats, or a
# crowd it has had), for the size filter; size says it in words. metres stands
# in for lat/lon where a source gives only a distance. suits lists the kinds of event (tools/extensions.py KINDS) the
# place fits. check_first marks places GoatConf may use for its own program.
# photo is a file under site/img/venues/, with its record beside the original
# in assets/images/venues/.
checked: '2026-10-23'
